<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>针织行式编译台</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <div class="title-row">
    <h1>针织行式编译台</h1>
    <label class="caston">起针数
      <input id="castOn" type="number" min="1" max="2000" value="24">
    </label>
    <span id="status" class="status"></span>
  </div>
  <div class="hint">
    针法（消耗/产出）：<code>k</code> 1/1 · <code>p</code> 1/1 ·
    <code>yo</code> 0/1 · <code>k2tog</code> 2/1 ｜
    分组：<code>(…)xN</code> 可嵌套 ｜
    行末重复：<code>*…*</code>（单次消耗须为正且整除余针，重复到行末）｜
    每行源码 = 一行针织；整行消耗必须恰好等于上一行针数，不得截断或补针
  </div>
</header>

<main>
  <section class="pane" id="srcPane">
    <h2>① 源码 <span class="sub">（每行一行针法）</span></h2>
    <div class="editor">
      <div id="gutter" class="gutter" aria-hidden="true"></div>
      <textarea id="src" spellcheck="false" wrap="off"
        autocomplete="off" autocapitalize="off"></textarea>
    </div>
  </section>

  <section class="pane" id="rowsPane">
    <h2>② 展开结果 <span class="sub">（点击针法可定位源码）</span></h2>
    <div id="rows" class="rows"></div>
  </section>

  <section class="pane" id="chartPane">
    <h2>③ 图解 <span class="sub">（第 1 行在底部，点击格元回到源码）</span></h2>
    <div id="chartWrap" class="chart-wrap">
      <svg id="chart" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-label="针织图解"></svg>
    </div>
    <div class="legend">
      <span><i class="sw k"></i>k 下针</span>
      <span><i class="sw p"></i>p 上针</span>
      <span><i class="sw yo"></i>yo 挂线</span>
      <span><i class="sw k2tog"></i>k2tog 二并一</span>
    </div>
  </section>
</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
